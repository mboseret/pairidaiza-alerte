name: Surveiller Pairi Daiza

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Envoyer un e-mail de test (sans vérifier le calendrier)"
        type: boolean
        default: false
        required: false
      external_live:
        description: "Vérification réelle déclenchée de l'extérieur"
        type: boolean
        default: false
        required: false

permissions:
  contents: read
  issues: write

concurrency:
  group: pairidaiza-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_MONITOR == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:   
      DIAGNOSTIC: ${{ github.event_name == 'workflow_dispatch' && inputs.external_live != true && 'true' || 'false' }}
      TEST_EMAIL: ${{ inputs.test_email || 'false' }}
      ENABLE_MONITOR: ${{ vars.ENABLE_MONITOR }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Vérifier le calendrier ou envoyer un test
        run: python monitor.py

      - name: Sauvegarder le diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-pairidaiza-${{ github.run_id }}
          path: diagnostic/
          if-no-files-found: ignore
          retention-days: 7
